name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much
        as you can — camera/hardware details in particular make these much
        faster to track down, since only the ZWO ASI camera line is
        currently verified against real hardware.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Step-by-step, so it can be reproduced reliably.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.1 (Sequoia)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Skyformac version
      placeholder: e.g. v0.4.0 (Settings > About, or the release you downloaded)
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Camera / hardware model
      placeholder: e.g. ZWO ASI678MC over USB, or "iPhone 15 via Continuity Camera"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: The in-app Application Log, a screenshot, or a crash report, if applicable.
    validations:
      required: false
